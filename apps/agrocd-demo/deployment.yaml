apiVersion: apps/v1
kind: Deployment

metadata:
  name: agrocd-demo

spec:
  replicas: 6

  selector:
    matchLabels:
      app: agrocd-demo

  template:
    metadata:
      labels:
        app: agrocd-demo

    spec:
      containers:
        - name: agrocd-demo
          image: ghcr.io/derryman101/agrocd-demo:e2961d13ff6e5c5f886ec81e24154f7307e5f854
          imagePullPolicy: IfNotPresent
          env:
            - name: GIT_SHA
              value: "e2961d13ff6e5c5f886ec81e24154f7307e5f854"

          ports:
            - containerPort: 3001
