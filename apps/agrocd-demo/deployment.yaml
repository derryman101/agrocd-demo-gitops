apiVersion: apps/v1
kind: Deployment

metadata:
  name: agrocd-demo

spec:
  replicas: 6

  selector:
    matchLabels:
      app: agrocd-demo

  template:
    metadata:
      labels:
        app: agrocd-demo

    spec:
      containers:
        - name: agrocd-demo
          image: ghcr.io/derryman101/agrocd-demo:9ccbd3798a36504821c08f4f995808085cf68dad
          imagePullPolicy: IfNotPresent

          ports:
            - containerPort: 3001
