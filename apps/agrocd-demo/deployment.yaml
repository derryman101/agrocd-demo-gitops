apiVersion: apps/v1
kind: Deployment

metadata:
  name: agrocd-demo

spec:
  replicas: 6

  selector:
    matchLabels:
      app: agrocd-demo

  template:
    metadata:
      labels:
        app: agrocd-demo

    spec:
      containers:
        - name: agrocd-demo
          image: ghcr.io/derryman101/agrocd-demo:9d01f25d90068745dd5c031bbdcdec1125d69467
          imagePullPolicy: IfNotPresent
          env:
            - name: GIT_SHA
              value: "9d01f25d90068745dd5c031bbdcdec1125d69467"

          ports:
            - containerPort: 3001
